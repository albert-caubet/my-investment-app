# Indicator catalog for the macro scorecard (PLAN.md sections 3 and 4).
#
# One [[series]] per stored series. Fields:
#   id          unique, stable identifier used as the DuckDB series_id
#   label       what the scorecard prints
#   group       rates | policy | surveys | composites | inflation | labor | housing |
#               investment | consumer | credit | fiscal | valuation | positioning | internals
#   source      fred | ecb | eurostat | oecd | bis | yahoo | shiller | ebp | philly |
#               nyfed_recprob | hlw | cot | release | derived
#   key         the source's own identifier (FRED id, ECB FLOW/KEY, Eurostat query, ticker ...)
#   frequency   D daily, W weekly, M monthly, Q quarterly, A annual, I irregular
#   lag_days    typical days between the end of the period and its publication
#   transform   how the scorecard reads the series: level | yoy | mom | ann3m | diff3m | diff12m | ma4w | ma3m
#   direction   which way is the concern: high_bad | low_bad | neutral
#   units       printed after the value
#   critical    the refresh job exits non-zero when a critical series fails or is stale
#   show        false for raw inputs that only feed derived series
#   fallback    id of another series to read when this one is missing or stale
#   inputs      (derived) catalog ids passed to the formula, in order
#   formula     (derived) name in invest.macro.derived.FORMULAS
#
# Monthly and quarterly observations are dated on the first day of their period,
# following FRED. Rates are in percent.

[defaults]
z_window_years = 10
critical = false
lag_days = 0

