  { label = "Russell Midcap", symbol = "IWR", currency = "USD", about = "US mid caps, the 800 smallest of the 1,000 largest", proxy = "iShares Russell Mid-Cap ETF" },
  { label = "STOXX Europe Small 200", symbol = "EXSE.DE", currency = "EUR", about = "Europe, the 200 smallest of the STOXX 600", proxy = "iShares STOXX Europe Small 200 UCITS ETF (DE)" },
  { label = "STOXX Europe Mid 200", symbol = "EXSD.DE", currency = "EUR", about = "Europe, the middle 200 of the STOXX 600", proxy = "iShares STOXX Europe Mid 200 UCITS ETF (DE)" },
  { label = "MSCI World Small Cap", symbol = "^106230-USD-STRD", currency = "USD", about = "23 developed countries, small caps" },
  { label = "MSCI World Mid Cap", symbol = "IWSZ.L", currency = "USD", about = "23 developed countries, mid caps", proxy = "iShares MSCI World Mid-Cap Equal Weight UCITS ETF, equal-weighted where the index is cap-weighted" },
  { label = "MSCI ACWI Small Cap", symbol = "^655045-USD-STRD", currency = "USD", about = "47 developed and emerging countries, small caps" },
]

