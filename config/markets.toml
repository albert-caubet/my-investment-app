# Market charts on the Macro page. Each [[chart]] overlays its series, every one
# rebased to its first close in the time range shown, so the lines compare as
# % change from a common start. The refresh job downloads every symbol here from
# Yahoo Finance into the prices table; the page reads them from there.
#
# Fields of a series:
#   label     the name in the legend
#   symbol    the Yahoo Finance symbol
#   currency  what Yahoo quotes the closes in (USc: US cents); shown in the hover.
#             Each line moves in its own currency, not in euros.
#   about     what the index covers, in a few words; printed under the chart.
#   proxy     set when the symbol stands in for the index: what it actually is.
#             A proxy is marked * in the legend and described under the chart.
#   note      a series with no symbol is not charted; the note says why, and is
#             printed under the chart.
#
# Symbols checked against Yahoo on 2026-10-04. Yahoo has only a live quote, no
# history, for the MSCI EM, MSCI World Mid Cap, Russell Midcap, OBX, WIG20, mWIG40,
# sWIG80, BUX, FTSE Italia Mid Cap, IBEX Small Cap and OMX Stockholm Mid and Small Cap;
# nothing for the PX or ^BCOM; and a history that stops on 2015-12-18 for the CAC Mid
# 60, CAC Small, AScX, BEL Mid, BEL Small and FTSE Italia Small Cap, and in 2018 for
# the IBEX Medium Cap. Those are charted through an ETF on the same index where one
# trades, and through a close index otherwise.
#
# The DAX, MDAX and SDAX are Deutsche Börse's performance indices, with dividends
# reinvested, as are the total-return proxies; the other indices are price indices.

[[chart]]
id = "world"
title = "World main indices"
series = [
  { label = "S&P 500", symbol = "^GSPC", currency = "USD", about = "US, 500 large caps" },
  { label = "STOXX Europe 600", symbol = "^STOXX", currency = "EUR", about = "Europe, 600 large, mid and small caps in 17 countries" },
  { label = "Euro Stoxx 50", symbol = "^STOXX50E", currency = "EUR", about = "eurozone, 50 largest" },
  { label = "MSCI Emerging Markets", symbol = "EEM", currency = "USD", about = "24 emerging countries, large and mid caps, led by China, Taiwan and India", proxy = "iShares MSCI Emerging Markets ETF" },
  { label = "MSCI World", symbol = "^990100-USD-STRD", currency = "USD", about = "23 developed countries, large and mid caps; about 70% US" },
  { label = "MSCI ACWI", symbol = "^892400-USD-STRD", currency = "USD", about = "47 developed and emerging countries, large and mid caps; about 65% US" },
  { label = "NASDAQ Composite", symbol = "^IXIC", currency = "USD", about = "US, every stock listed on Nasdaq; tech-heavy" },
]

