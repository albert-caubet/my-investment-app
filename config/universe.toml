# Screener universes (PLAN.md section 6.1).
#
# Each [universe.<name>] lists tickers, and optionally a `csv` with a `ticker`
# column (and any other columns) whose entries are added to the list. Tickers are
# resolved to SEC CIKs through the company ticker file on each run; unresolved
# tickers are reported, never dropped silently.
#
# The shipped list is a hand-maintained subset of current S&P 500 members, so it
# carries survivorship bias (companies that left the index are absent). Replace or
# extend it with a maintained constituents file when one is available:
#   csv = "config/universe/sp500.csv"

[universe.sp500_core]
label = "S&P 500 core (large members, hand-maintained)"
note = "Current members only; about 150 of the largest names across every sector."
tickers = [
