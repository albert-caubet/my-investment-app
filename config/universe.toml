# Screener universes (PLAN.md section 6.1).
#
# Each [universe.<name>] lists tickers, and optionally a `csv` with a `ticker`
# column (and any other columns) whose entries are added to the list. Unresolved
# tickers are reported, never dropped silently.
#
#   region        "US" or "EU": which side of the Screener page's market selector
#                 shows the table. Default "US".
#   source        where the accounts come from. "edgar" (default): SEC filings, the
#                 tickers resolved to CIKs through the SEC's company ticker file,
#                 point-in-time. "yahoo": Yahoo Finance, by Yahoo symbol (SAP.DE,
#                 NOVO-B.CO, BT-A.L), not point-in-time.
#   point_in_time true only for "edgar"; a "yahoo" universe must say false.
#
# The Screener page builds sp500_core for the US and stoxx600 for the EU
# (DEFAULT_UNIVERSES in invest/jobs/fundamentals.py); any other universe is built with
#   python -m invest.jobs.fundamentals --universe NAME
# and shown under its region until the next build of that region.
#
# The shipped lists are hand-maintained lists of current members, so they carry
# survivorship bias (companies that left the index are absent). Replace or extend
# one with a maintained constituents file when one is available:
#   csv = "config/universe/sp500.csv"

[universe.sp500_core]
label = "S&P 500 core (large members, hand-maintained)"
note = "Current members only; about 150 of the largest names across every sector."
region = "US"
source = "edgar"
tickers = [
